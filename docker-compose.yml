services:
  postgres:
    image: postgres:16-alpine
    container_name: doodle-postgres
    environment:
      POSTGRES_DB: doodle
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle
    ports:
      - "5433:5432"
    volumes:
      - doodle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doodle -d doodle"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doodle-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: doodle
      DB_USER: doodle
      DB_PASSWORD: doodle
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  doodle-postgres-data:
